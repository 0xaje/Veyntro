<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title description">
  <title id="title">Veyntro — Every commitment accounted for</title>
  <desc id="description">A DAO approves work, the Commitment Firewall checks available funds, and checked work can be paid on NEAR testnet.</desc>
  <rect width="1200" height="390" rx="24" fill="#080b12"/>
  <rect x="36" y="34" width="44" height="44" rx="12" fill="#2563eb"/>
  <text x="58" y="64" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#ffffff">V</text>
  <text x="96" y="65" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#ffffff">Veyntro</text>
  <rect x="994" y="42" width="168" height="29" rx="14" fill="#14213d" stroke="#34558d"/>
  <text x="1078" y="61" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#bfdbfe">NEAR testnet</text>
  <text x="38" y="133" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#ffffff">Every commitment accounted for.</text>
  <text x="39" y="170" font-family="Arial,sans-serif" font-size="18" fill="#cbd5e1">Set money aside for approved work without promising the same funds twice.</text>
  <g font-family="Arial,sans-serif">
    <rect x="38" y="219" width="345" height="121" rx="15" fill="#111827" stroke="#334155"/>
    <rect x="428" y="219" width="345" height="121" rx="15" fill="#111827" stroke="#2563eb"/>
    <rect x="818" y="219" width="344" height="121" rx="15" fill="#111827" stroke="#166534"/>
    <circle cx="70" cy="251" r="12" fill="#60a5fa"/>
    <circle cx="460" cy="251" r="12" fill="#3b82f6"/>
    <circle cx="850" cy="251" r="12" fill="#22c55e"/>
    <text x="92" y="257" font-size="19" font-weight="700" fill="#ffffff">DAO approves</text>
    <text x="482" y="257" font-size="19" font-weight="700" fill="#ffffff">Firewall checks</text>
    <text x="872" y="257" font-size="19" font-weight="700" fill="#ffffff">Checked work paid</text>
    <text x="56" y="293" font-size="16" fill="#cbd5e1">SputnikDAO records the decision.</text>
    <text x="446" y="293" font-size="16" fill="#cbd5e1">The contract protects funds already</text>
    <text x="446" y="316" font-size="16" fill="#cbd5e1">set aside for other work.</text>
    <text x="836" y="293" font-size="16" fill="#cbd5e1">The contract records the final</text>
    <text x="836" y="316" font-size="16" fill="#cbd5e1">payment result on NEAR.</text>
    <text x="394" y="285" text-anchor="middle" font-size="28" fill="#93c5fd">→</text>
    <text x="784" y="285" text-anchor="middle" font-size="28" fill="#93c5fd">→</text>
  </g>
</svg>
