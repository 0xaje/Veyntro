[package]
name = "veyntro-dao-receiver"
version = "0.1.0"
edition = "2024"
publish = false
repository = "https://github.com/0xaje/Veyntro"
description = "DAO-only receiving contract for Veyntro's governance integration gate"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.0"

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }
