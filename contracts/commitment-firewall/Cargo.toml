[package]
name = "veyntro-commitment-firewall"
version = "0.1.0"
edition = "2024"
publish = false
repository = "https://github.com/0xaje/Veyntro"
description = "DAO-controlled backed commitments and pending-safe NEAR payments"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.0", features = ["legacy"] }

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["legacy", "unit-testing"] }
