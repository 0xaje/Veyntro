services:
  - type: web
    runtime: static
    name: veyntro-web
    branch: codex/phase4-ui-corrections
    envVars:
      - key: NODE_VERSION
        value: 24.12.0
    buildCommand: npm --prefix apps/web ci && npm --prefix apps/web run build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
