name: Web app checks

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, verified commit
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked web dependencies without lifecycle scripts
        run: npm --prefix apps/web ci --ignore-scripts --no-audit --no-fund
      - name: Check types and build the web app
        run: |
          npm --prefix apps/web run check
          node --test apps/web/test/setup-proposal.test.ts
          node --test apps/web/test/browser-evidence.test.ts
          npm --prefix apps/web run build
